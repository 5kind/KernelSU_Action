name: BakaSU Raphael Nightly

on:
  schedule:
    # Run once daily at 03:17 UTC.
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: ${{ github.workflow_ref }}
  cancel-in-progress: false

env:
  UPSTREAM_REPO: Baka-SU/BakaSU
  UPSTREAM_BRANCH: main
  UPSTREAM_WORKFLOW: build-manager.yml
  TARGET_WORKFLOW: build-kernel.yml

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.upstream.outputs.sha }}
      should_build: ${{ steps.decision.outputs.should_build }}

    steps:
      - name: Check latest upstream commit and build result
        id: upstream
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          gh api \
            "repos/$UPSTREAM_REPO/commits/$UPSTREAM_BRANCH" \
            > /tmp/commit.json

          SHA="$(python3 -c \
            'import json; print(json.load(open("/tmp/commit.json"))["sha"])')"

          echo "Upstream branch: $UPSTREAM_BRANCH"
          echo "Upstream commit: $SHA"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

          # Check whether Build Manager succeeded for this exact commit.
          gh api \
            "repos/$UPSTREAM_REPO/actions/workflows/$UPSTREAM_WORKFLOW/runs?branch=$UPSTREAM_BRANCH&head_sha=$SHA&status=completed&per_page=50" \
            > /tmp/runs.json

          if python3 - "$SHA" "$UPSTREAM_BRANCH" <<'PY'
          import json
          import sys

          sha, branch = sys.argv[1:3]
          runs = json.load(open("/tmp/runs.json"))["workflow_runs"]

          ok = any(
              run.get("head_sha") == sha
              and run.get("head_branch") == branch
              and run.get("conclusion") == "success"
              for run in runs
          )

          print(f"Successful upstream build for {sha}: {ok}")
          sys.exit(0 if ok else 1)
          PY
          then
            echo "success=true" >> "$GITHUB_OUTPUT"
          else
            echo "success=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check whether this commit was already processed
        id: cache
        if: steps.upstream.outputs.success == 'true'
        uses: actions/cache/restore@v4
        with:
          path: .cache/bakasu-main.sha
          key: bakasu-main-${{ steps.upstream.outputs.sha }}
          lookup-only: true

      - name: Decide whether to build
        id: decision
        env:
          UPSTREAM_SUCCESS: ${{ steps.upstream.outputs.success }}
          CACHE_HIT: ${{ steps.cache.outputs.cache-hit }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$UPSTREAM_SUCCESS" != "true" ]]; then
            echo "Upstream build has not succeeded; skipping."
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          elif [[ "$CACHE_HIT" == "true" ]]; then
            echo "This upstream commit was already processed."
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          else
            echo "New successfully built upstream commit detected."
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check
    if: needs.check.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      - name: Derive target branch from workflow filename
        shell: bash
        run: |
          set -euo pipefail
          # github.workflow_ref = {owner}/{repo}/.github/workflows/{file}@{ref}
          WORKFLOW_FILE="$(basename "${GITHUB_WORKFLOW_REF%%@*}")"
          TARGET_BRANCH="${WORKFLOW_FILE%.yml}"
          echo "Target branch: $TARGET_BRANCH"
          echo "TARGET_BRANCH=$TARGET_BRANCH" >> "$GITHUB_ENV"

      - name: Verify target branch and build workflow
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          # Verify the target branch exists.
          gh api \
            "repos/$GITHUB_REPOSITORY/branches/$TARGET_BRANCH" \
            > /dev/null

          # Verify the original build workflow is active.
          gh api \
            "repos/$GITHUB_REPOSITORY/actions/workflows/$TARGET_WORKFLOW" \
            > /tmp/workflow-state.json

          python3 - <<'PY'
          import json

          data = json.load(open("/tmp/workflow-state.json"))
          if data.get("state") != "active":
              raise SystemExit("The original build workflow is not active.")
          PY

          # Verify workflow_dispatch and the release input exist
          # in the target branch's version of the workflow.
          gh api \
            "repos/$GITHUB_REPOSITORY/contents/.github/workflows/$TARGET_WORKFLOW?ref=$TARGET_BRANCH" \
            > /tmp/target-workflow.json

          python3 - <<'PY'
          import base64
          import json

          data = json.load(open("/tmp/target-workflow.json"))
          content = base64.b64decode(data["content"]).decode()

          if "workflow_dispatch:" not in content:
              raise SystemExit("Target workflow lacks workflow_dispatch.")

          if "publish_release" not in content:
              raise SystemExit("Target workflow lacks publish_release.")

          print("Target workflow checks passed.")
          PY

      - name: Dispatch original build and release workflow
        id: dispatch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          STARTED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "started_at=$STARTED_AT" >> "$GITHUB_OUTPUT"

          gh workflow run "$TARGET_WORKFLOW" \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$TARGET_BRANCH" \
            -f publish_release=true

          echo "Dispatched $TARGET_WORKFLOW on $TARGET_BRANCH"

      - name: Wait for the build and release
        env:
          GH_TOKEN: ${{ github.token }}
          STARTED_AT: ${{ steps.dispatch.outputs.started_at }}
        shell: bash
        run: |
          set -euo pipefail

          RUN_ID=""

          # Wait for GitHub to register the dispatched run.
          for _ in {1..30}; do
            gh api \
              "repos/$GITHUB_REPOSITORY/actions/workflows/$TARGET_WORKFLOW/runs?branch=$TARGET_BRANCH&event=workflow_dispatch&per_page=20" \
              > /tmp/target-runs.json

            RUN_ID="$(python3 - "$STARTED_AT" "$TARGET_BRANCH" <<'PY'
          import json
          import sys

          started, branch = sys.argv[1:3]
          runs = json.load(open("/tmp/target-runs.json"))["workflow_runs"]

          matches = [
              run for run in runs
              if run.get("head_branch") == branch
              and run.get("event") == "workflow_dispatch"
              and run.get("created_at", "") >= started
          ]

          matches.sort(
              key=lambda run: run.get("created_at", ""),
              reverse=True
          )

          print(matches[0]["id"] if matches else "")
          PY
          )"

            if [[ -n "$RUN_ID" ]]; then
              break
            fi

            sleep 10
          done

          if [[ -z "$RUN_ID" ]]; then
            echo "Could not find the dispatched workflow run."
            exit 1
          fi

          echo "Watching run ID: $RUN_ID"

          gh run watch "$RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --exit-status

      - name: Mark upstream commit as processed
        env:
          UPSTREAM_SHA: ${{ needs.check.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .cache
          printf '%s\n' "$UPSTREAM_SHA" > .cache/bakasu-main.sha

      - name: Save processed commit marker
        uses: actions/cache/save@v4
        with:
          path: .cache/bakasu-main.sha
          key: bakasu-main-${{ needs.check.outputs.sha }}

  disable_after_failure:
    needs: [check, build]
    if: >-
      always() &&
      needs.check.outputs.should_build == 'true' &&
      needs.build.result == 'failure'
    runs-on: ubuntu-latest

    steps:
      - name: Disable this monitoring workflow
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
        shell: bash
        run: |
          set -euo pipefail

          # github.workflow_ref format:
          #   {owner}/{repo}/.github/workflows/{file}@{ref}
          # Strip everything after '@', then take the basename.
          WORKFLOW_FILE="$(basename "${WORKFLOW_REF%%@*}")"

          echo "Current workflow file: $WORKFLOW_FILE"
          echo "The target build failed; disabling this monitoring workflow."

          gh api \
            --method PUT \
            "repos/$GITHUB_REPOSITORY/actions/workflows/$WORKFLOW_FILE/disable"

          echo "Monitoring workflow $WORKFLOW_FILE disabled."
